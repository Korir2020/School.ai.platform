<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MARIAN — Light Background</title>

<style>
:root {
  --background: #101114;
  --gold: #ffc75e;
  --glow: rgba(255, 183, 65, 0.35);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  background: var(--background);
  overflow-x: hidden;
  font-family: sans-serif;
}

/* Main background */

.bulb-scene {
  position: relative;
  width: 100%;
  min-height: 100svh;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(
      ellipse at 50% 23%,
      rgba(151, 105, 42, 0.12),
      transparent 38%
    ),
    linear-gradient(
      180deg,
      #17181b 0%,
      #101114 55%,
      #0c0d10 100%
    );
}

/* Wall texture */

.bulb-scene::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;

  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.30'/%3E%3C/svg%3E");

  opacity: 0.17;
  mix-blend-mode: soft-light;
}

/* Soft ambient illumination */

.ambient-light {
  position: absolute;
  top: 7%;
  left: 50%;
  width: min(90vw, 700px);
  height: min(100vw, 700px);

  transform: translateX(-50%);
  border-radius: 50%;

  background: radial-gradient(
    ellipse,
    rgba(255, 184, 75, 0.14) 0%,
    rgba(255, 176, 58, 0.06) 32%,
    transparent 68%
  );

  filter: blur(22px);
  pointer-events: none;
}

/* Bulb positioning */

.bulb-container {
  position: absolute;
  top: 0;
  left: 50%;

  width: 280px;
  height: 600px;

  transform: translateX(-50%);
  transform-origin: top center;
}

/* Hanging cable */

.bulb-cord {
  position: absolute;
  top: 0;
  left: 50%;

  width: 3px;
  height: 100px;

  transform: translateX(-50%);

  background: linear-gradient(
    90deg,
    #08090a,
    #424247 45%,
    #101114
  );
}

/* Light emitted below bulb */

.light-beam {
  position: absolute;
  top: 215px;
  left: 50%;

  width: 280px;
  height: 340px;

  transform: translateX(-50%);

  background: linear-gradient(
    180deg,
    rgba(255, 196, 94, 0.28) 0%,
    rgba(255, 185, 74, 0.12) 24%,
    rgba(255, 171, 55, 0.045) 60%,
    transparent 100%
  );

  clip-path: polygon(
    42% 0,
    58% 0,
    100% 100%,
    0 100%
  );

  filter: blur(13px);
  pointer-events: none;
}

/* Bulb glow */

.bulb-glow {
  position: absolute;
  top: 95px;
  left: 50%;

  width: 220px;
  height: 240px;

  transform: translateX(-50%);
  border-radius: 50%;

  background: radial-gradient(
    ellipse,
    rgba(255, 203, 105, 0.30) 0%,
    rgba(255, 183, 75, 0.15) 30%,
    rgba(255, 172, 55, 0.05) 55%,
    transparent 75%
  );

  filter: blur(17px);

  animation: glow 4s ease-in-out infinite alternate;
}

/* Bulb artwork */

.bulb-art {
  position: absolute;
  top: 75px;
  left: 50%;

  width: 170px;
  height: 250px;

  transform: translateX(-50%);

  overflow: visible;
  filter:
    drop-shadow(0 0 12px rgba(255, 190, 80, 0.25));
}

.bulb-art svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* Natural subtle variation in light */

@keyframes glow {
  from {
    opacity: 0.83;
  }

  to {
    opacity: 1;
  }
}

/* Mobile */

@media (max-width: 600px) {
  .bulb-container {
    transform: translateX(-50%) scale(0.86);
    transform-origin: top center;
  }

  .ambient-light {
    top: 4%;
  }
}

/* Respect reduced motion */

@media (prefers-reduced-motion: reduce) {
  .bulb-glow {
    animation: none;
  }
}
</style>
</head>

<body>

<main class="bulb-scene">

  <div class="ambient-light"></div>

  <div class="bulb-container">

    <div class="bulb-cord"></div>

    <div class="bulb-glow"></div>

    <div class="light-beam"></div>

    <div class="bulb-art">

      <svg
        viewBox="0 0 170 250"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >

        <defs>

          <!-- Metallic socket -->

          <linearGradient
            id="metal"
            x1="0"
            y1="0"
            x2="1"
            y2="0"
          >
            <stop offset="0%" stop-color="#171719"/>
            <stop offset="18%" stop-color="#49494b"/>
            <stop offset="36%" stop-color="#222225"/>
            <stop offset="65%" stop-color="#555458"/>
            <stop offset="85%" stop-color="#252528"/>
            <stop offset="100%" stop-color="#101113"/>
          </linearGradient>

          <!-- Reflective glass -->

          <linearGradient
            id="glass"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
          >
            <stop offset="0%" stop-color="#fff5ce" stop-opacity=".48"/>
            <stop offset="25%" stop-color="#ffe7a1" stop-opacity=".12"/>
            <stop offset="55%" stop-color="#ffffff" stop-opacity=".04"/>
            <stop offset="82%" stop-color="#ffc86a" stop-opacity=".12"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity=".25"/>
          </linearGradient>

          <!-- Glowing filament -->

          <radialGradient id="filamentGlow">
            <stop offset="0%" stop-color="#fffef0"/>
            <stop offset="35%" stop-color="#fff1a5"/>
            <stop offset="75%" stop-color="#ffb62e"/>
            <stop offset="100%" stop-color="#ff9c16" stop-opacity="0"/>
          </radialGradient>

          <!-- Internal warm illumination -->

          <radialGradient id="innerLight">
            <stop offset="0%" stop-color="#fff5c0" stop-opacity=".88"/>
            <stop offset="45%" stop-color="#ffd66e" stop-opacity=".25"/>
            <stop offset="100%" stop-color="#ffc45c" stop-opacity="0"/>
          </radialGradient>

          <filter id="filamentBlur">
            <feGaussianBlur stdDeviation="5"/>
          </filter>

          <filter id="softGlow">
            <feGaussianBlur stdDeviation="2.5"/>
          </filter>

        </defs>

        <!-- Socket neck -->

        <path
          d="M69 17 L101 17 L101 34
             L105 42 L65 42 L69 34 Z"
          fill="url(#metal)"
          stroke="#111214"
          stroke-width="1.5"
        />

        <!-- Metal screw socket -->

        <path
          d="M63 38
             Q60 38 60 43
             L60 86
             Q60 91 66 91
             L104 91
             Q110 91 110 86
             L110 43
             Q110 38 104 38 Z"
          fill="url(#metal)"
          stroke="#090a0b"
          stroke-width="2"
        />

        <!-- Socket grooves -->

        <g
          fill="none"
          stroke-linecap="round"
        >
          <path d="M62 46 H108" stroke="#77767a" stroke-width="1.3"/>
          <path d="M61 52 H109" stroke="#090a0b" stroke-width="2"/>
          <path d="M61 59 H109" stroke="#6c6b70" stroke-width="1.1"/>
          <path d="M61 65 H109" stroke="#08090a" stroke-width="2"/>
          <path d="M61 72 H109" stroke="#5b5a5e" stroke-width="1.1"/>
          <path d="M62 79 H108" stroke="#09090a" stroke-width="2"/>
          <path d="M64 85 H106" stroke="#68676b" stroke-width="1"/>
        </g>

        <!-- Glass bulb silhouette -->

        <path
          d="
            M70 88
            C69 98 64 104 55 113
            C41 127 34 145 36 165
            C38 188 53 207 70 214
            C76 217 94 217 100 214
            C117 207 132 188 134 165
            C136 145 129 127 115 113
            C106 104 101 98 100 88
            Z
          "
          fill="url(#glass)"
          stroke="#f4dca7"
          stroke-opacity=".72"
          stroke-width="1.5"
        />

        <!-- Warm internal light -->

        <ellipse
          cx="85"
          cy="164"
          rx="47"
          ry="51"
          fill="url(#innerLight)"
        />

        <!-- Filament's soft glow -->

        <g filter="url(#filamentBlur)" opacity=".95">
          <ellipse
            cx="85"
            cy="160"
            rx="20"
            ry="24"
            fill="#ffb52e"
          />
        </g>

        <!-- Glass support stem -->

        <path
          d="M81 93
             L81 140
             L85 153
             L89 140
             L89 93"
          fill="#fff4c6"
          fill-opacity=".35"
          stroke="#ffdfa0"
          stroke-opacity=".65"
          stroke-width="1"
        />

        <!-- Filament support wires -->

        <g
          fill="none"
          stroke="#ffe8a8"
          stroke-width="1.1"
          stroke-linecap="round"
        >
          <path d="M81 134 L76 158"/>
          <path d="M89 134 L94 158"/>
          <path d="M85 146 L85 169"/>
        </g>

        <!-- Glowing filament -->

        <path
          d="
            M76 158
            L79 153
            L82 158
            L85 153
            L88 158
            L91 153
            L94 158
          "
          fill="none"
          stroke="#ffbc3c"
          stroke-width="6"
          opacity=".9"
          filter="url(#softGlow)"
        />

        <path
          d="
            M76 158
            L79 153
            L82 158
            L85 153
            L88 158
            L91 153
            L94 158
          "
          fill="none"
          stroke="#fff4b0"
          stroke-width="1.8"
          stroke-linejoin="round"
        />

        <!-- Bright central filament -->

        <circle
          cx="85"
          cy="156"
          r="13"
          fill="url(#filamentGlow)"
        />

        <ellipse
          cx="85"
          cy="156"
          rx="6"
          ry="4"
          fill="#fffde8"
        />

        <!-- Glass reflections -->

        <path
          d="M53 126
             Q42 145 46 163"
          fill="none"
          stroke="#ffffff"
          stroke-opacity=".55"
          stroke-width="2"
          stroke-linecap="round"
        />

        <path
          d="M58 120
             Q54 125 52 132"
          fill="none"
          stroke="#ffffff"
          stroke-opacity=".4"
          stroke-width="1.2"
          stroke-linecap="round"
        />

        <path
          d="M116 130
             Q126 146 122 160"
          fill="none"
          stroke="#fff4d0"
          stroke-opacity=".5"
          stroke-width="2"
          stroke-linecap="round"
        />

        <path
          d="M62 197
             Q85 210 108 197"
          fill="none"
          stroke="#ffe9bd"
          stroke-opacity=".55"
          stroke-width="1.3"
        />

        <!-- Small realistic glass highlights -->

        <ellipse
          cx="47"
          cy="174"
          rx="2"
          ry="4"
          fill="#fff7e2"
          opacity=".55"
        />

        <ellipse
          cx="121"
          cy="175"
          rx="1.5"
          ry="3"
          fill="#fff5dc"
          opacity=".45"
        />

      </svg>

    </div>

  </div>

</main>

</body>
</html>
